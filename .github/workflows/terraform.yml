name: "Terraform Deploy to Azure"

on:
  workflow_dispatch:   # run manually
  push:
    paths:
      - 'terraform/**'   # run when terraform files change

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CREDENTIALS_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_CREDENTIALS_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_CREDENTIALS_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CREDENTIALS_CLIENT_SECRET }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var="client_id=${{ secrets.AZURE_CREDENTIALS_CLIENT_ID }}" \
                            -var="client_secret=${{ secrets.AZURE_CREDENTIALS_CLIENT_SECRET }}" \
                            -var="tenant_id=${{ secrets.AZURE_CREDENTIALS_TENANT_ID }}" \
                            -var="subscription_id=${{ secrets.AZURE_CREDENTIALS_SUBSCRIPTION_ID }}" \
                            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var="client_id=${{ secrets.AZURE_CREDENTIALS_CLIENT_ID }}" \
                             -var="client_secret=${{ secrets.AZURE_CREDENTIALS_CLIENT_SECRET }}" \
                             -var="tenant_id=${{ secrets.AZURE_CREDENTIALS_TENANT_ID }}" \
                             -var="subscription_id=${{ secrets.AZURE_CREDENTIALS_SUBSCRIPTION_ID }}" \
                             -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}"
